name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fortylove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fortylove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fortylove_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c "create role service_role noinherit"
      - run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/storage_stub.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/inspect_current.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/manual/production_upgrade_20260905.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/verify_production.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p0_quality.sql
      - name: Prepare reservation concurrency test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/reservation_concurrency_setup.sql
      - name: Race 20 reservations for one remaining seat
        run: |
          seq -w 000000000001 000000000020 | xargs -P 20 -I {} \
            psql -v ON_ERROR_STOP=1 -Atc "select public.reserve_event('20000000-0000-0000-0000-{}'::uuid, '10000000-0000-0000-0000-000000000001'::uuid)"
      - name: Verify reservation capacity after concurrency
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/reservation_concurrency_assert.sql

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-key
          SESSION_SECRET: ci-only-session-secret-at-least-32-characters
          CRON_SECRET: ci-only-cron-secret
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:smoke
